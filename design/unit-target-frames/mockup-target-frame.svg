<svg xmlns="http://www.w3.org/2000/svg" width="584" height="236" viewBox="0 0 584 236" role="img" aria-labelledby="title desc">
  <title id="title">Demon Slayer inspired target frame mockup</title>
  <desc id="desc">A World of Warcraft target frame with enemy styling, portrait, name, level, classification, health, power, raid icon, threat, and aura rows.</desc>
  <defs>
    <linearGradient id="targetShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23100f"/>
      <stop offset="0.48" stop-color="#100b0a"/>
      <stop offset="1" stop-color="#421217"/>
    </linearGradient>
    <linearGradient id="targetBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdf9c"/>
      <stop offset="0.45" stop-color="#d9a754"/>
      <stop offset="1" stop-color="#7e3b24"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76151a"/>
      <stop offset="0.62" stop-color="#c63b3f"/>
      <stop offset="1" stop-color="#ff9a76"/>
    </linearGradient>
    <linearGradient id="rage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c0711"/>
      <stop offset="0.6" stop-color="#d81f37"/>
      <stop offset="1" stop-color="#ffcf74"/>
    </linearGradient>
    <filter id="threatGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9 0 0.18 0 0 0.1 0 0 0.05 0 0.02 0 0 0 0.8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="slash" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="18" height="18" fill="#140d0c"/>
      <rect width="5" height="18" fill="#5d1519" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="584" height="236" fill="#0a0807"/>
  <g transform="translate(20 34)" filter="url(#threatGlow)">
    <path d="M18 0H274L292 18V96L274 116H18L0 98V18Z" fill="url(#targetShell)" stroke="#6f161b" stroke-width="3"/>
    <path d="M24 7H268L284 22V90L268 109H24L8 92V24Z" fill="none" stroke="url(#targetBrass)" stroke-width="2"/>
    <path d="M20 15H57V101H20Z" fill="url(#slash)" opacity="0.78"/>
    <path d="M86 18C136 7 202 8 264 23" fill="none" stroke="#c63b3f" stroke-width="2" opacity="0.46"/>
    <path d="M86 100C131 79 210 99 270 76" fill="none" stroke="#ff644f" stroke-width="2.4" opacity="0.48"/>

    <circle cx="48" cy="50" r="35" fill="#070505" stroke="url(#targetBrass)" stroke-width="4"/>
    <path d="M23 33C34 5 75 4 84 43C71 29 40 27 23 33Z" fill="#d9a754" opacity="0.64"/>
    <circle cx="48" cy="50" r="27" fill="#1b0d10"/>
    <path d="M32 63C39 33 66 34 71 59C60 77 43 78 32 63Z" fill="#84202a"/>
    <path d="M38 44L47 54L61 38L55 62L39 60Z" fill="#ffdf9c" opacity="0.76"/>
    <circle cx="72" cy="76" r="13" fill="#17100d" stroke="#d9a754" stroke-width="2"/>
    <text x="72" y="81" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#ffdf9c">??</text>

    <text x="82" y="25" font-family="Arial, sans-serif" font-size="11" fill="#ffd0ba" opacity="0.85">恶鬼 · 血鬼术</text>
    <text x="248" y="25" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffb7a2">十二鬼月 · 上弦</text>
    <text x="82" y="47" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffd986">Dreadlord</text>
    <text x="254" y="47" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#ff8f8f">Demon</text>

    <rect x="80" y="57" width="198" height="16" rx="2" fill="#080605" stroke="#d9a754" stroke-width="1.4"/>
    <rect x="82" y="59" width="116" height="12" rx="1.5" fill="url(#blood)"/>
    <path d="M84 61H193" stroke="#ffffff" stroke-width="2" opacity="0.16"/>
    <text x="88" y="69" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff2db">生命</text>
    <text x="272" y="69" text-anchor="end" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff2db">58%</text>

    <rect x="80" y="80" width="198" height="14" rx="2" fill="#080605" stroke="#b83a3d" stroke-width="1.2"/>
    <rect x="82" y="82" width="80" height="10" rx="1.5" fill="url(#rage)"/>
    <path d="M84 84H158" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
    <text x="88" y="91" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#ffe5d4">怒意</text>
    <text x="272" y="91" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#ffe5d4">41%</text>

    <g transform="translate(210 7)">
      <polygon points="0,-8 7,-2 4,8 -4,8 -7,-2" fill="#f2cb33" stroke="#4b2100"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" font-family="Arial" font-weight="700" fill="#4b2100">8</text>
      <circle cx="22" cy="0" r="7" fill="#98242a" stroke="#ffd0ba"/>
      <text x="22" y="3" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#fff">P</text>
      <circle cx="40" cy="0" r="7" fill="#e07a2e" stroke="#ffd0ba"/>
      <text x="40" y="3" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#fff">T</text>
      <circle cx="58" cy="0" r="7" fill="#555" stroke="#ffd0ba"/>
      <text x="58" y="3" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#fff">X</text>
    </g>
  </g>

  <g transform="translate(104 160)">
    <text x="-82" y="-7" font-family="Arial, sans-serif" font-size="10" fill="#f4e0b0">Auras</text>
    <g>
      <rect x="0" y="0" width="22" height="22" rx="3" fill="#2f7ee6" stroke="#d9a754"/>
      <rect x="28" y="0" width="22" height="22" rx="3" fill="#6f161b" stroke="#d9a754"/>
      <rect x="56" y="0" width="22" height="22" rx="3" fill="#2a7d44" stroke="#d9a754"/>
      <rect x="84" y="0" width="22" height="22" rx="3" fill="#79378f" stroke="#d9a754"/>
      <rect x="112" y="0" width="22" height="22" rx="3" fill="#d9a754" stroke="#6f161b"/>
      <rect x="140" y="0" width="22" height="22" rx="3" fill="#202020" stroke="#6f161b"/>
      <text x="11" y="15" text-anchor="middle" font-size="10" font-family="Arial" fill="#fff">B</text>
      <text x="39" y="15" text-anchor="middle" font-size="10" font-family="Arial" fill="#fff">D</text>
      <text x="67" y="15" text-anchor="middle" font-size="10" font-family="Arial" fill="#fff">B</text>
      <text x="95" y="15" text-anchor="middle" font-size="10" font-family="Arial" fill="#fff">D</text>
      <text x="123" y="15" text-anchor="middle" font-size="10" font-family="Arial" fill="#3b1d0b">B</text>
      <text x="151" y="15" text-anchor="middle" font-size="10" font-family="Arial" fill="#fff">D</text>
    </g>
  </g>

  <g transform="translate(326 34)">
    <text x="0" y="2" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffd986">Target frame states</text>
    <text x="0" y="27" font-family="Arial, sans-serif" font-size="11" fill="#ffd0ba">Enemy: red lacquer shell, blood art subtitle</text>
    <text x="0" y="49" font-family="Arial, sans-serif" font-size="11" fill="#ffd0ba">Elite/rare: portrait crest replaces original dragon role</text>
    <text x="0" y="71" font-family="Arial, sans-serif" font-size="11" fill="#ffd0ba">Raid target, PvP, threat, tapped, dead/offline slots</text>
    <text x="0" y="93" font-family="Arial, sans-serif" font-size="11" fill="#ffd0ba">Friendly target swaps to Corps teal/blue accents</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="11" fill="#ffd0ba">Auras attach below frame using original order/filter rules</text>
  </g>
</svg>
