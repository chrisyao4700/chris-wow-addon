<svg xmlns="http://www.w3.org/2000/svg" width="584" height="208" viewBox="0 0 584 208" role="img" aria-labelledby="title desc">
  <title id="title">Demon Slayer inspired player unit frame mockup</title>
  <desc id="desc">A World of Warcraft player unit frame with portrait, name, level, health, power, rank, PvP, combat, resting, and leader status slots.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="0.42" stop-color="#100d0b"/>
      <stop offset="1" stop-color="#27140f"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7df94"/>
      <stop offset="0.48" stop-color="#d0a64e"/>
      <stop offset="1" stop-color="#7d5521"/>
    </linearGradient>
    <linearGradient id="health" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#328c5a"/>
      <stop offset="0.55" stop-color="#45c06d"/>
      <stop offset="1" stop-color="#b7f5a0"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5798"/>
      <stop offset="0.55" stop-color="#2f7ee6"/>
      <stop offset="1" stop-color="#9fd8ff"/>
    </linearGradient>
    <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#123738"/>
      <rect width="8" height="8" fill="#0b1717"/>
      <rect x="8" y="8" width="8" height="8" fill="#0b1717"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="584" height="208" fill="#0a0807"/>
  <g transform="translate(20 34)">
    <path d="M18 0H274L292 18V96L274 116H18L0 98V18Z" fill="url(#shell)" stroke="#3c2818" stroke-width="3"/>
    <path d="M24 7H268L284 22V90L268 109H24L8 92V24Z" fill="none" stroke="url(#brass)" stroke-width="2"/>
    <path d="M17 12H54V104H17Z" fill="url(#checker)" opacity="0.72"/>
    <path d="M72 13C112 3 168 8 209 16" fill="none" stroke="#f4e0b0" stroke-width="1.5" opacity="0.28"/>
    <path d="M76 95C132 83 180 93 250 82" fill="none" stroke="#2f7ee6" stroke-width="2" opacity="0.42" filter="url(#softGlow)"/>

    <circle cx="48" cy="50" r="34" fill="#080707" stroke="url(#brass)" stroke-width="4"/>
    <circle cx="48" cy="50" r="27" fill="#202733"/>
    <path d="M28 61C36 43 58 37 69 53C61 73 42 76 28 61Z" fill="#2f7ee6" opacity="0.52"/>
    <path d="M29 42C44 24 71 36 72 58C59 46 43 45 29 42Z" fill="#f0d08a" opacity="0.72"/>
    <circle cx="72" cy="76" r="13" fill="#15100c" stroke="url(#brass)" stroke-width="2"/>
    <text x="72" y="81" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#f7df94">60</text>

    <rect x="82" y="13" width="14" height="14" rx="2" fill="#0a0c15" stroke="#5daee8" stroke-width="1"/>
    <path d="M85 24L88 16L92 21L94 15L93 24Z" fill="#7fd1ff"/>
    <path d="M86 15C89 18 93 18 95 15" fill="none" stroke="#f7df94" stroke-width="1"/>
    <text x="101" y="25" font-family="Arial, sans-serif" font-size="11" fill="#f4e0b0" opacity="0.82">鬼杀队 · 水之呼吸</text>
    <text x="248" y="25" text-anchor="end" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#f7df94">甲</text>
    <text x="82" y="47" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f7df94">Chrisyao</text>
    <text x="254" y="47" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#89d7ff">Mage</text>

    <rect x="80" y="57" width="198" height="16" rx="2" fill="#080605" stroke="#d9b35f" stroke-width="1.4"/>
    <rect x="82" y="59" width="172" height="12" rx="1.5" fill="url(#health)"/>
    <path d="M84 61H249" stroke="#ffffff" stroke-width="2" opacity="0.18"/>
    <text x="88" y="69" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#10100d">生命</text>
    <text x="272" y="69" text-anchor="end" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#fff3bd">4380 / 4380</text>

    <rect x="80" y="80" width="198" height="14" rx="2" fill="#080605" stroke="#5daee8" stroke-width="1.2"/>
    <rect x="82" y="82" width="136" height="10" rx="1.5" fill="url(#focus)"/>
    <path d="M84 84H215" stroke="#ffffff" stroke-width="2" opacity="0.16"/>
    <text x="88" y="91" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#eef8ff">全集中</text>
    <text x="272" y="91" text-anchor="end" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#eef8ff">2950 / 4200</text>

    <g transform="translate(212 7)">
      <circle cx="0" cy="0" r="7" fill="#2e72d2" stroke="#f4e0b0"/>
      <text x="0" y="3" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#fff">Z</text>
      <circle cx="18" cy="0" r="7" fill="#9e2429" stroke="#f4e0b0"/>
      <text x="18" y="3" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#fff">!</text>
      <circle cx="36" cy="0" r="7" fill="#22496f" stroke="#f4e0b0"/>
      <text x="36" y="3" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#fff">P</text>
      <circle cx="54" cy="0" r="7" fill="#8f6b23" stroke="#f4e0b0"/>
      <text x="54" y="3" text-anchor="middle" font-size="8" font-family="Arial" font-weight="700" fill="#fff">L</text>
    </g>
  </g>

  <g transform="translate(326 34)">
    <text x="0" y="2" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f7df94">Player frame zones</text>
    <text x="0" y="27" font-family="Arial, sans-serif" font-size="11" fill="#f4e0b0">1. Portrait seal: portrait + level + dead/offline overlay</text>
    <text x="0" y="49" font-family="Arial, sans-serif" font-size="11" fill="#f4e0b0">2. Identity: name, class, PvP, raid/party status</text>
    <text x="0" y="71" font-family="Arial, sans-serif" font-size="11" fill="#f4e0b0">3. Rank: class icon + Corps rank + breathing style</text>
    <text x="0" y="93" font-family="Arial, sans-serif" font-size="11" fill="#f4e0b0">4. Resources: health and power values</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="11" fill="#f4e0b0">5. Status rail: resting, combat, leader, loot, PvP</text>
  </g>
</svg>
