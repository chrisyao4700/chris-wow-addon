<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Chris Wow Addon logo</title>
  <desc id="desc">An original fantasy addon logo with red flame and teal spirit swirls, a gold crest, and a central demon blade rune.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="47%" r="64%">
      <stop offset="0%" stop-color="#18232b"/>
      <stop offset="46%" stop-color="#06070a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <radialGradient id="redPaint" cx="33%" cy="43%" r="55%">
      <stop offset="0%" stop-color="#ff6b3d"/>
      <stop offset="32%" stop-color="#b41912"/>
      <stop offset="72%" stop-color="#3f0808"/>
      <stop offset="100%" stop-color="#050000"/>
    </radialGradient>

    <radialGradient id="tealPaint" cx="70%" cy="43%" r="58%">
      <stop offset="0%" stop-color="#bff5ee"/>
      <stop offset="26%" stop-color="#317f79"/>
      <stop offset="70%" stop-color="#0a2b2d"/>
      <stop offset="100%" stop-color="#000606"/>
    </radialGradient>

    <linearGradient id="gold" x1="197" y1="163" x2="998" y2="1041" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="19%" stop-color="#c57a24"/>
      <stop offset="50%" stop-color="#4b2610"/>
      <stop offset="78%" stop-color="#d8a342"/>
      <stop offset="100%" stop-color="#fff7be"/>
    </linearGradient>

    <linearGradient id="darkGold" x1="332" y1="279" x2="868" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#402010"/>
      <stop offset="43%" stop-color="#d59838"/>
      <stop offset="100%" stop-color="#221109"/>
    </linearGradient>

    <linearGradient id="blade" x1="584" y1="121" x2="633" y2="401" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5fffa"/>
      <stop offset="30%" stop-color="#8df8ff"/>
      <stop offset="68%" stop-color="#0e92a4"/>
      <stop offset="100%" stop-color="#06292f"/>
    </linearGradient>

    <linearGradient id="letterGold" x1="318" y1="820" x2="897" y2="1008" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7c4"/>
      <stop offset="22%" stop-color="#c47d23"/>
      <stop offset="47%" stop-color="#fff0a5"/>
      <stop offset="72%" stop-color="#a75c1c"/>
      <stop offset="100%" stop-color="#f4c561"/>
    </linearGradient>

    <filter id="drop" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity=".72"/>
    </filter>

    <filter id="hotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.55 0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 .72 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="spiritGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.82 0 0 0 0 0.78 0 0 0 .7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bladeGlow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.95 0 0 0 0 1 0 0 0 .9 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

